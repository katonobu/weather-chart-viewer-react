name: Deploy Dev (Manual)

on:
  workflow_dispatch:

env:
  SERVICE: weatherchart
#  STAGE: dev
#  ACCOUNT_ID: 357665575661  # ← devアカウントID
#  DIST_ID: E1JJPY985HNT3W

#  STAGE: stg
#  ACCOUNT_ID: 108241940789  # ← stgアカウントID
#  DIST_ID: E1292AX6TFD99W

  STAGE: prd
  ACCOUNT_ID: 179698341762
  DIST_ID: EGL2TZY90L0OC

  AWS_REGION: ap-northeast-1


jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
        id-token: write
        contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # AWS認証（OIDC）
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/${{ env.SERVICE }}ContentsGitHubRole

      # =========================
      # Node ver. 20である警告対策
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: 20
          
      # =========================
      # build（vite）
      # =========================
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build-${{ env.STAGE }}

      # =========================
      # S3 deploy
      # =========================
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist \
            s3://frontend-${{ env.STAGE }}-${{ env.SERVICE }}-site \
            --delete

      # =========================
      # CloudFront invalidate
      # =========================
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.DIST_ID}} \
            --paths "/*"